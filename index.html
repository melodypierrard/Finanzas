<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finanzas 2026</title>
    
    <!-- Configuración para PWA (App Móvil) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10384/10384160.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .card-custom { background: white; border-radius: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .card-custom:active { transform: scale(0.98); }
        .income-gradient { background: linear-gradient(135deg, #10b981, #059669); }
        .expense-gradient { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .main-gradient { background: linear-gradient(135deg, #1e293b, #0f172a); }
        
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="pb-24">

    <!-- Header Estilo iOS/Android Premium -->
    <div class="safe-top main-gradient text-white rounded-b-[40px] pb-12 shadow-2xl relative overflow-hidden">
        <div class="px-8 py-6 flex justify-between items-center relative z-10">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">Financial<span class="text-blue-400">Hub</span></h1>
                <p id="headerDate" class="text-[9px] font-bold opacity-40 uppercase tracking-widest"></p>
            </div>
            <div class="bg-white/10 p-1 rounded-2xl flex backdrop-blur-md">
                <button onclick="changeView('home')" id="navHome" class="px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition bg-white text-slate-900">Inicio</button>
                <button onclick="changeView('stats')" id="navStats" class="px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition text-white/60">Stats</button>
            </div>
        </div>

        <div class="px-8 text-center mt-4 relative z-10">
            <p class="text-[10px] font-bold opacity-30 uppercase tracking-widest mb-1">Balance Consolidado</p>
            <h2 id="totalBalance" class="text-5xl font-black tracking-tighter animate-fade">$0</h2>
            
            <div class="flex justify-center gap-6 mt-8">
                <div class="bg-white/5 backdrop-blur-sm rounded-3xl p-4 flex-1">
                    <p class="text-[8px] font-bold opacity-40 uppercase mb-1">Ingresos</p>
                    <p id="totalInc" class="text-sm font-bold text-emerald-400">$0</p>
                </div>
                <div class="bg-white/5 backdrop-blur-sm rounded-3xl p-4 flex-1">
                    <p class="text-[8px] font-bold opacity-40 uppercase mb-1">Gastos</p>
                    <p id="totalExp" class="text-sm font-bold text-rose-400">$0</p>
                </div>
            </div>
        </div>
        
        <!-- Decoración de fondo -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl -mr-20 -mt-20"></div>
    </div>

    <main id="view-home" class="px-6 -mt-8 space-y-6 relative z-20">
        <!-- Panel de Registro -->
        <div class="card-custom p-6 border border-slate-100/50">
            <div class="flex gap-2 mb-4">
                <button onclick="setTxType('exp')" id="tabExp" class="flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-900 text-white shadow-lg">Gasto</button>
                <button onclick="setTxType('inc')" id="tabInc" class="flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-50 text-slate-400">Ingreso</button>
            </div>
            
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="desc" placeholder="¿Qué compraste?" class="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-100 transition text-sm font-medium">
                </div>
                <div class="relative">
                    <input type="number" id="amt" placeholder="0.00" class="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-100 transition text-lg font-black">
                    <span class="absolute right-4 top-4 text-slate-300 font-bold">$</span>
                </div>
                <button onclick="handleSave()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-100 active:scale-95 transition">Guardar Movimiento</button>
            </div>
        </div>

        <!-- Lista de Movimientos -->
        <div id="listContainer" class="space-y-3 pb-12">
            <!-- Items generados por JS -->
        </div>
    </main>

    <main id="view-stats" class="hidden px-6 py-10 text-center animate-fade">
        <div class="card-custom p-10">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 tracking-tight">Análisis de Datos</h3>
            <p class="text-xs text-slate-400 mt-2 leading-relaxed">Estamos procesando tus movimientos para mostrarte gráficos de torta y barras en la próxima actualización.</p>
            <button onclick="changeView('home')" class="mt-8 text-blue-600 font-bold text-xs uppercase tracking-widest">Volver al inicio</button>
        </div>
    </main>

    <!-- Barra de Navegación Flotante -->
    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-white/80 backdrop-blur-xl rounded-[30px] flex justify-around items-center px-6 z-50 shadow-2xl border border-white/20">
        <button onclick="changeView('home')" class="p-3 text-blue-600 bg-blue-50 rounded-2xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </button>
        <button onclick="handleExport()" class="p-3 text-slate-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        </button>
        <button onclick="if(confirm('¿Borrar historial?')) { localStorage.clear(); location.reload(); }" class="p-3 text-slate-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </nav>

    <script>
        let state = {
            type: 'exp',
            data: JSON.parse(localStorage.getItem('fin_v2026_db')) || []
        };

        function setTxType(t) {
            state.type = t;
            document.getElementById('tabExp').className = t === 'exp' ? 'flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-900 text-white shadow-lg' : 'flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-50 text-slate-400';
            document.getElementById('tabInc').className = t === 'inc' ? 'flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-900 text-white shadow-lg' : 'flex-1 py-3 rounded-2xl text-[10px] font-bold uppercase transition bg-slate-50 text-slate-400';
        }

        function changeView(v) {
            document.getElementById('view-home').classList.toggle('hidden', v !== 'home');
            document.getElementById('view-stats').classList.toggle('hidden', v !== 'stats');
            document.getElementById('navHome').className = v === 'home' ? 'px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition bg-white text-slate-900' : 'px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition text-white/60';
            document.getElementById('navStats').className = v === 'stats' ? 'px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition bg-white text-slate-900' : 'px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition text-white/60';
        }

        function handleSave() {
            const desc = document.getElementById('desc').value;
            const amt = parseFloat(document.getElementById('amt').value);
            if(!desc || isNaN(amt)) return;

            state.data.unshift({
                id: Date.now(),
                desc,
                amt,
                type: state.type,
                date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })
            });

            localStorage.setItem('fin_v2026_db', JSON.stringify(state.data));
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            refreshUI();
        }

        function deleteRecord(id) {
            state.data = state.data.filter(i => i.id !== id);
            localStorage.setItem('fin_v2026_db', JSON.stringify(state.data));
            refreshUI();
        }

        function refreshUI() {
            let bal = 0, inc = 0, exp = 0;
            const container = document.getElementById('listContainer');
            container.innerHTML = '<h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2">Actividad Reciente</h4>';

            state.data.forEach(item => {
                if(item.type === 'inc') inc += item.amt; else exp += item.amt;
                
                container.innerHTML += `
                    <div class="card-custom p-5 flex justify-between items-center animate-fade">
                        <div class="flex items-center gap-4">
                            <div class="w-11 h-11 rounded-2xl ${item.type === 'inc' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} flex items-center justify-center font-bold text-[9px] uppercase tracking-tighter">
                                ${item.date}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm leading-none mb-1">${item.desc}</p>
                                <p class="text-[9px] font-bold text-slate-300 uppercase">${item.type === 'inc' ? 'Abono' : 'Cargo'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-black text-sm ${item.type === 'inc' ? 'text-emerald-500' : 'text-slate-900'}">
                                ${item.type === 'inc' ? '+' : '-'}$${item.amt.toLocaleString()}
                            </span>
                            <button onclick="deleteRecord(${item.id})" class="text-slate-200">✕</button>
                        </div>
                    </div>`;
            });

            document.getElementById('totalBalance').innerText = `$${(inc - exp).toLocaleString()}`;
            document.getElementById('totalInc').innerText = `$${inc.toLocaleString()}`;
            document.getElementById('totalExp').innerText = `$${exp.toLocaleString()}`;
        }

        function handleExport() {
            const blob = new Blob([JSON.stringify(state.data)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'backup_finanzas_2026.json'; a.click();
        }

        window.onload = () => {
            const d = new Date();
            document.getElementById('headerDate').innerText = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            refreshUI();
        };
    </script>
</body>
</html>
