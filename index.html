<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centro Financiero 2026</title>
    
    <!-- PWA Setup -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .safe-top { padding-top: env(safe-area-inset-top); }
        
        .header-gradient {
            background: linear-gradient(135deg, #020617 0%, #1e293b 100%);
        }

        .card-pro {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        .tab-active {
            background: #2563eb !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .progress-bar {
            height: 10px;
            background: #f1f5f9;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Animación suave */
        .view-content {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Evitar que el teclado móvil rompa el layout */
        input:focus { font-size: 16px !important; }
    </style>
</head>
<body class="pb-32">

    <!-- DASHBOARD SUPERIOR -->
    <div class="header-gradient text-white pb-16 safe-top rounded-b-[45px] shadow-2xl relative overflow-hidden">
        <div class="px-8 py-8 flex justify-between items-center relative z-10">
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter">CENTRO<span class="text-blue-500">PRO</span></h1>
                <p id="topDate" class="text-[10px] font-bold opacity-40 uppercase tracking-widest mt-1"></p>
            </div>
            <div class="bg-blue-500/20 px-4 py-1.5 rounded-2xl border border-blue-500/20">
                <span class="text-[10px] font-black text-blue-300">ACTIVO</span>
            </div>
        </div>

        <div class="px-8 text-center relative z-10">
            <span class="text-[10px] font-bold opacity-30 uppercase tracking-[0.2em]">Balance Global</span>
            <h2 id="mainBal" class="text-5xl font-black tracking-tighter my-3">$0</h2>
            
            <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="bg-white/5 backdrop-blur-md rounded-3xl p-4 border border-white/10">
                    <p class="text-[9px] font-bold opacity-40 uppercase mb-1">Ingresos</p>
                    <p id="mainInc" class="text-lg font-bold text-emerald-400">$0</p>
                </div>
                <div class="bg-white/5 backdrop-blur-md rounded-3xl p-4 border border-white/10">
                    <p class="text-[9px] font-bold opacity-40 uppercase mb-1">Gastos</p>
                    <p id="mainExp" class="text-lg font-bold text-rose-400">$0</p>
                </div>
            </div>
        </div>
        
        <!-- Efecto de luz -->
        <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-600/10 rounded-full blur-3xl"></div>
    </div>

    <!-- SELECTOR DE VISTAS (Pestañas) -->
    <div class="px-6 -mt-8 relative z-30">
        <div class="bg-white p-1.5 rounded-[22px] flex shadow-2xl border border-slate-100">
            <button id="t-home" onclick="changeView('home')" class="flex-1 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all tab-active">Historial</button>
            <button id="t-savings" onclick="changeView('savings')" class="flex-1 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all text-slate-400">Ahorros</button>
            <button id="t-bills" onclick="changeView('bills')" class="flex-1 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all text-slate-400">Agenda</button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container" class="px-6 mt-8 space-y-6">
        <!-- El contenido se inyecta vía JavaScript para mayor estabilidad -->
    </main>

    <!-- NAVBAR INFERIOR -->
    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[35px] shadow-2xl flex justify-around items-center px-6 z-50 border border-white/10">
        <button onclick="changeView('home')" class="p-3 text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </button>
        <button onclick="exportJSON()" class="p-3 text-slate-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5l5 5v11a2 2 0 01-2 2z"></path></svg>
        </button>
        <button onclick="clearAll()" class="p-3 text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </nav>

    <!-- MODAL -->
    <div id="modalWrap" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[100] flex items-end">
        <div class="w-full bg-white rounded-t-[45px] p-8 pb-12 shadow-2xl transform transition-transform duration-300">
            <div id="modalBody"></div>
            <button onclick="closeMod()" class="w-full mt-6 py-4 text-slate-400 font-bold text-[10px] uppercase tracking-widest">Cerrar</button>
        </div>
    </div>

    <script>
        // Estado inicial
        let state = {
            view: 'home',
            mode: 'exp',
            records: JSON.parse(localStorage.getItem('pro26_recs')) || [],
            savings: JSON.parse(localStorage.getItem('pro26_savs')) || [],
            bills: JSON.parse(localStorage.getItem('pro26_bills')) || []
        };

        // Función para cambiar de vista
        function changeView(v) {
            state.view = v;
            document.querySelectorAll('[id^="t-"]').forEach(btn => btn.classList.remove('tab-active', 'text-slate-400'));
            document.getElementById('t-' + v).classList.add('tab-active');
            render();
        }

        function setMode(m) {
            state.mode = m;
            render();
        }

        // Acciones de Datos
        function addRecord() {
            const d = document.getElementById('in-desc').value;
            const a = parseFloat(document.getElementById('in-amt').value);
            if(!d || isNaN(a)) return;
            
            state.records.unshift({ id: Date.now(), d, a, type: state.mode, date: new Date().toLocaleDateString('es-ES') });
            save();
        }

        function deleteRec(id) {
            state.records = state.records.filter(r => r.id !== id);
            save();
        }

        function saveSaving() {
            const name = document.getElementById('s-name').value;
            const target = parseFloat(document.getElementById('s-target').value);
            const date = document.getElementById('s-date').value;
            if(!name || isNaN(target)) return;
            state.savings.push({ id: Date.now(), name, target, current: 0, date });
            save();
            closeMod();
        }

        function addMoney(id, val) {
            const s = state.savings.find(x => x.id === id);
            s.current += val;
            save();
        }

        function saveBill() {
            const name = document.getElementById('b-name').value;
            const amt = parseFloat(document.getElementById('b-amt').value);
            const date = document.getElementById('b-date').value;
            if(!name || isNaN(amt)) return;
            state.bills.push({ id: Date.now(), name, amt, date, paid: false });
            save();
            closeMod();
        }

        function save() {
            localStorage.setItem('pro26_recs', JSON.stringify(state.records));
            localStorage.setItem('pro26_savs', JSON.stringify(state.savings));
            localStorage.setItem('pro26_bills', JSON.stringify(state.bills));
            render();
        }

        // UI Modales
        function openMod(type) {
            const body = document.getElementById('modalBody');
            document.getElementById('modalWrap').classList.remove('hidden');
            
            if(type === 'saving') {
                body.innerHTML = `
                    <h3 class="text-xl font-black text-slate-800 mb-6">Nueva Meta</h3>
                    <input type="text" id="s-name" placeholder="¿Para qué ahorras?" class="w-full bg-slate-100 p-4 rounded-2xl mb-3 outline-none">
                    <input type="number" id="s-target" placeholder="Monto total ($)" class="w-full bg-slate-100 p-4 rounded-2xl mb-3 outline-none">
                    <input type="date" id="s-date" class="w-full bg-slate-100 p-4 rounded-2xl mb-6 outline-none text-slate-400">
                    <button onclick="saveSaving()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl">Crear Meta</button>
                `;
            } else {
                body.innerHTML = `
                    <h3 class="text-xl font-black text-slate-800 mb-6">Nuevo Vencimiento</h3>
                    <input type="text" id="b-name" placeholder="Servicio / Factura" class="w-full bg-slate-100 p-4 rounded-2xl mb-3 outline-none">
                    <input type="number" id="b-amt" placeholder="Monto ($)" class="w-full bg-slate-100 p-4 rounded-2xl mb-3 outline-none">
                    <input type="date" id="b-date" class="w-full bg-slate-100 p-4 rounded-2xl mb-6 outline-none text-slate-400">
                    <button onclick="saveBill()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl">Agendar Pago</button>
                `;
            }
        }

        function closeMod() { document.getElementById('modalWrap').classList.add('hidden'); }

        // RENDERIZADO MAESTRO
        function render() {
            // Totales del Dashboard
            const inc = state.records.filter(r => r.type === 'inc').reduce((a,b) => a + b.a, 0);
            const exp = state.records.filter(r => r.type === 'exp').reduce((a,b) => a + b.a, 0);
            document.getElementById('mainBal').innerText = `$${(inc - exp).toLocaleString()}`;
            document.getElementById('mainInc').innerText = `$${inc.toLocaleString()}`;
            document.getElementById('mainExp').innerText = `$${exp.toLocaleString()}`;

            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if(state.view === 'home') {
                container.innerHTML = `
                    <div class="card-pro p-6 view-content">
                        <div class="flex gap-2 mb-5 bg-slate-50 p-1.5 rounded-[20px]">
                            <button onclick="setMode('exp')" class="flex-1 py-2.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${state.mode === 'exp' ? 'bg-white shadow text-slate-900' : 'text-slate-400'}">Gasto</button>
                            <button onclick="setMode('inc')" class="flex-1 py-2.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all ${state.mode === 'inc' ? 'bg-white shadow text-slate-900' : 'text-slate-400'}">Ingreso</button>
                        </div>
                        <input type="text" id="in-desc" placeholder="Concepto" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none border-none">
                        <input type="number" id="in-amt" placeholder="Monto 0.00" class="w-full bg-slate-50 p-4 rounded-2xl mb-5 outline-none font-black text-xl border-none">
                        <button onclick="addRecord()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-100">Registrar</button>
                    </div>
                    <div class="space-y-3 pb-8">
                        ${state.records.slice(0, 15).map(r => `
                            <div class="card-pro p-5 flex justify-between items-center view-content">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-2xl bg-slate-50 flex flex-col items-center justify-center font-bold text-[8px] text-slate-400 border border-slate-100">
                                        <span>${r.date.split('/')[1]}</span><span>${r.date.split('/')[0]}</span>
                                    </div>
                                    <div>
                                        <p class="font-bold text-slate-800 text-sm">${r.d}</p>
                                        <p class="text-[9px] font-bold text-slate-300 uppercase">${r.type === 'inc' ? 'Ingreso' : 'Gasto'}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="font-black text-sm ${r.type === 'inc' ? 'text-emerald-500' : 'text-slate-900'}">${r.type === 'inc' ? '+' : '-'}$${r.a.toLocaleString()}</span>
                                    <button onclick="deleteRec(${r.id})" class="text-slate-200">✕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            } else if(state.view === 'savings') {
                container.innerHTML = `
                    <div class="flex justify-between items-center px-2 view-content">
                        <h3 class="text-xl font-black text-slate-800">Tus Metas</h3>
                        <button onclick="openMod('saving')" class="w-11 h-11 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg">+</button>
                    </div>
                    <div class="space-y-4 pb-8">
                        ${state.savings.map(s => {
                            const p = Math.min((s.current / s.target) * 100, 100);
                            return `
                                <div class="card-pro p-6 view-content">
                                    <div class="flex justify-between items-start mb-4">
                                        <div><p class="font-black text-slate-800 text-lg">${s.name}</p><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Meta: $${s.target.toLocaleString()}</p></div>
                                        <p class="text-blue-600 font-black text-xl leading-none">$${s.current.toLocaleString()}</p>
                                    </div>
                                    <div class="progress-bar mb-6"><div class="progress-fill" style="width: ${p}%"></div></div>
                                    <div class="flex gap-2">
                                        <button onclick="addMoney(${s.id}, 1000)" class="flex-1 bg-slate-900 text-white text-[9px] font-black py-3 rounded-xl">+ $1.000</button>
                                        <button onclick="addMoney(${s.id}, 5000)" class="flex-1 bg-slate-900 text-white text-[9px] font-black py-3 rounded-xl">+ $5.000</button>
                                        <button onclick="state.savings = state.savings.filter(x => x.id !== ${s.id}); save();" class="p-3 bg-slate-50 rounded-xl text-slate-300">✕</button>
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>`;
            } else if(state.view === 'bills') {
                container.innerHTML = `
                    <div class="flex justify-between items-center px-2 view-content">
                        <h3 class="text-xl font-black text-slate-800">Próximos Pagos</h3>
                        <button onclick="openMod('bill')" class="w-11 h-11 bg-slate-900 text-white rounded-2xl flex items-center justify-center shadow-lg">+</button>
                    </div>
                    <div class="space-y-3 pb-8">
                        ${state.bills.sort((a,b) => new Date(a.date) - new Date(b.date)).map(b => `
                            <div class="card-pro p-5 flex justify-between items-center view-content ${b.paid ? 'opacity-40 grayscale' : ''}">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex flex-col items-center justify-center border border-slate-700">
                                        <span class="text-[8px] font-bold uppercase opacity-50">${new Date(b.date).toLocaleDateString('es-ES', {month:'short'})}</span>
                                        <span class="text-sm font-black">${new Date(b.date).getDate() + 1}</span>
                                    </div>
                                    <div><p class="font-bold text-slate-800 text-sm leading-tight">${b.name}</p><p class="text-[11px] font-bold text-blue-500">$${b.amt.toLocaleString()}</p></div>
                                </div>
                                <button onclick="const x = state.bills.find(y => y.id === ${b.id}); x.paid = !x.paid; save();" 
                                        class="px-5 py-2.5 rounded-xl text-[9px] font-black uppercase tracking-widest ${b.paid ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'}">
                                    ${b.paid ? 'PAGADO' : 'PENDIENTE'}
                                </button>
                            </div>
                        `).join('')}
                    </div>`;
            }
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(state)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'centro_pro_2026.json'; a.click();
        }

        function clearAll() { if(confirm('¿Reiniciar todo el sistema?')) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            const opt = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('topDate').innerText = new Date().toLocaleDateString('es-ES', opt);
            render();
        };
    </script>
</body>
</html>
